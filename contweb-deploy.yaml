apiVersion: apps/v1
kind: Deployment
metadata:
  name: contweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contweb
  template:
    metadata:
      labels:
        app: contweb
    spec:
      containers:
        - name: contweb
          image: web
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: contweb-service
spec:
  type: NodePort
  selector:
    app: contweb
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
