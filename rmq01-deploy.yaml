apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmq01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmq01
  template:
    metadata:
      labels:
        app: rmq01
    spec:
      containers:
        - name: rmq01
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "test"
            - name: RABBITMQ_DEFAULT_PASS
              value: "test"
---
apiVersion: v1
kind: Service
metadata:
  name: rmq01-service
spec:
  type: ClusterIP
  selector:
    app: rmq01
  ports:
    - port: 5672
      targetPort: 5672
    - port: 15672
      targetPort: 15672
