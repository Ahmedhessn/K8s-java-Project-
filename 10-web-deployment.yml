apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproweb
  labels:
    app: vproweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproweb
  template:
    metadata:
      labels:
        app: vproweb
    spec:
      containers:
      - name: vproweb
        image: 3booda24/vprofileweb
        ports:
        - containerPort: 80
        env:
        - name: APPHOST
          value: vproapp
